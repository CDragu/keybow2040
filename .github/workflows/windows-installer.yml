name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'keybow_net/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'keybow_net/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install -r desktop/packaging/requirements.txt
      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.6.1 --yes --no-progress
      - name: Build per-user installer
        run: ./desktop/packaging/build-windows.ps1
      - name: Test installer, startup shortcut and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/windows/*-Setup.exe | Select-Object -First 1).FullName
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Keybow Codex'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Startup')) 'Keybow Codex.lnk'
          $proc = Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=startup' -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $shortcut)) { throw 'Installation failed.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process (Join-Path $install 'KeybowCodex.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw 'Desktop startup did not complete in 30 seconds.'
          }
          if ($proc.ExitCode -ne 0) { throw 'Installed desktop failed to launch.' }
          $proc = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or (Test-Path -LiteralPath $shortcut) -or (Test-Path -LiteralPath (Join-Path $install 'KeybowCodex.exe'))) { throw 'Uninstall failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Keybow-Codex-Windows-x64-unsigned
          if-no-files-found: error
          path: |
            dist/windows/*-Setup.exe
            dist/windows/*-Setup.exe.sha256
