name: Keybow desktop and Pi network tests

on:
  push:
    paths:
      - 'desktop/**'
      - 'pi/**'
      - 'keybow_net/**'
      - '.github/workflows/desktop-tests.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'pi/**'
      - 'keybow_net/**'
      - '.github/workflows/desktop-tests.yml'

jobs:
  domain-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and fake backend tests
        run: python -m unittest desktop.tests.test_core desktop.tests.test_spotify desktop.tests.test_settings desktop.tests.test_simulator desktop.tests.test_codex_backend desktop.tests.test_stdio desktop.tests.test_pi_server keybow_net.tests.test_protocol keybow_net.tests.test_effects keybow_net.tests.test_pairing pi.tests.test_bridge -v

  domain-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows core and backend tests
        run: |
          python -m pip install -r desktop/requirements.txt
          python -m unittest desktop.tests.test_core desktop.tests.test_spotify desktop.tests.test_settings desktop.tests.test_simulator desktop.tests.test_codex_backend desktop.tests.test_stdio desktop.tests.test_pi_server keybow_net.tests.test_protocol keybow_net.tests.test_effects keybow_net.tests.test_pairing pi.tests.test_bridge -v

  qt-offscreen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install desktop dependency
        run: python -m pip install -r desktop/requirements.txt
      - name: Full UI, protocol and state tests
        run: |
          python -m unittest discover -s desktop/tests -v
          python -m unittest discover -s pi/tests -v
          python -m unittest discover -s keybow_net/tests -v
